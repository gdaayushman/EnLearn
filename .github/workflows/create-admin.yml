name: Create or update admin account

on:
  workflow_dispatch:

jobs:
  create-admin:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL:   ${{ secrets.DATABASE_URL }}
      ADMIN_EMAIL:    ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Sanity check
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "❌ DATABASE_URL secret is empty"; exit 1; fi
          if [ -z "$ADMIN_EMAIL" ];   then echo "❌ ADMIN_EMAIL secret is empty";   exit 1; fi
          if [ -z "$ADMIN_PASSWORD" ]; then echo "❌ ADMIN_PASSWORD secret is empty"; exit 1; fi
          echo "✅ All required secrets are present."

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Upsert admin
        run: |
          cat > upsert-admin.mjs <<'EOF'
          import { PrismaClient, Role } from "@prisma/client";
          import bcrypt from "bcryptjs";
          const prisma = new PrismaClient();
          const email = process.env.ADMIN_EMAIL;
          const password = process.env.ADMIN_PASSWORD;
          const hashed = await bcrypt.hash(password, 10);
          const user = await prisma.user.upsert({
            where: { email },
            update: { password: hashed, role: Role.admin, isActive: true },
            create: { name: "Aayushman", email, password: hashed, role: Role.admin },
          });
          console.log("✅ Admin ready:", user.email, "publicId:", user.publicId);
          await prisma.$disconnect();
          EOF
          node upsert-admin.mjs
          rm -f upsert-admin.mjs
